[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-agent-standalone"
version = "0.1.0"
description = "Standalone local conversation application with a Vue UI and FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
chat-agent-server = "chat_agent.server:main"
chat-agent-import = "chat_agent.migration:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chat_agent*"]

[tool.pytest.ini_options]
testpaths = ["backend_tests"]
pythonpath = ["."]
