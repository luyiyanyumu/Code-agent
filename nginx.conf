# Code-agent nginx 反向代理（M7）
# - /api/    -> app:8765（含 WebSocket 升级）
# - 其余     -> 前端静态产物（SPA history 路由回退 index.html）

upstream code_agent_app {
    server app:8765;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传/交付物下载放宽
    client_max_body_size 32m;

    # ---- API + WebSocket ----
    location /api/ {
        proxy_pass http://code_agent_app;
        proxy_http_version 1.1;

        # WebSocket 升级（/api/v1/sessions/{id}/stream）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：agent 一轮可能跑很久（工具链 + 审批等待）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # 流式事件不缓冲，实时推给前端
    }

    location = /healthz {
        proxy_pass http://code_agent_app/healthz;
        access_log off;
    }

    # ---- 前端静态产物 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA 路由回退
    }

    # 静态资源缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
