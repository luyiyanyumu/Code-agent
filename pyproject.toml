[project]
name = "code-agent"
version = "0.10.1"
description = "Code-agent - enterprise agent platform (core loop, runtime, memory, extensions, productization, hardening, delivery, model access, plugins)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.8",
    "pywinpty>=3.0,<4; sys_platform == 'win32'",
    "debugpy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# M49 办公文档链：随包自带的 office-* 技能里，xlsx 用**零依赖脚本**（开箱可用），
# docx/pptx 需要这两个库。装法：pip install -e ".[office]"。
# 技能正文的第一步就是"自检这两个库"，缺库时会**如实停下**并给出这条命令，
# 而不是硬写一段 import 然后拿 ImportError 去猜别的原因。
office = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
code-agent = "code_agent.cli:main"
code-agent-server = "code_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_agent*"]

# 随包自带的技能目录必须被装进去：`config.builtin_skills_dir()` 指的就是它。
# 不声明的话，`pip install` 出来的包里没有这些 SKILL.md/脚本——
# 而技能目录在源码 checkout 里跑得好好的，本机测不出来（典型的"只在打包后坏"）。
[tool.setuptools.package-data]
code_agent = ["skills/**/*.md", "skills/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
